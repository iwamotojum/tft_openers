<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFT Openers</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="clearFavs" title="Limpar favoritos"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.6l2.7 5.8 6.3.7-4.7 4.3 1.2 6.2L12 16.8l-5.5 2.8 1.2-6.2L3 9.1l6.3-.7L12 2.6z"/><line x1="4" y1="20" x2="20" y2="4"></line></svg></button>
<div class="search-wrapper">
  <span class="search-icon">⌕</span>
  <input type="text" id="search" placeholder="Aatrox" autofocus autocomplete="off">
  <button type="button" class="search-clear" id="searchClear" title="Limpar busca" aria-label="Limpar busca"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="suggestions" id="suggestions"></div>
</div>

<div class="tableau" id="tableau">
  <div class="stack" id="stack"></div>
</div>
<div class="nav-buttons">
  <button id="prevBtn" title="Anterior">‹</button>
  <button id="nextBtn" title="Próximo">›</button>
</div>
<div class="dots" id="dots"></div>

<script src="app.js"></script>
<div class="credit">Design e desenvolvimento por <strong>Dium</strong></div>
</body>
</html>
